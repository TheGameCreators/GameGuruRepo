name: Forward crash issue to GameGuruMAX

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  forward:
    if: github.event.label.name == 'forward-to-max'
    runs-on: ubuntu-latest

    steps:
      - name: Forward issue to GameGuruMAX
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MAX_ISSUE_BOT_TOKEN }}
          script: |
            const sourceOwner = context.repo.owner;
            const sourceRepo  = context.repo.repo;
            const sourceNum   = context.payload.issue.number;
            const issue       = context.payload.issue;

            const targetOwner = "Dark-Basic-Software-Limited";
            const targetRepo  = "GameGuruMAX";

            const bodyLines = [
              "🔁 **Forwarded from** " + sourceOwner + "/" + sourceRepo + "#" + sourceNum,
              issue.html_url,
              "",
              "---",
              "",
              issue.body || ""
            ];

            const created = await github.rest.issues.create({
              owner: targetOwner,
              repo: targetRepo,
              title: issue.title,
              body: bodyLines.join("\n"),
              labels: ["crash-triage"]
            });

            await github.rest.issues.createComment({
              owner: sourceOwner,
              repo: sourceRepo,
              issue_number: sourceNum,
              body: "✅ Forwarded to: " + created.data.html_url
            });
